{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold mb-4 text-dark"><i class="bi bi-plus-circle-fill text-warning me-2"></i>Nueva Actividad</h3>
                
                <form action="/actividad/nueva" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Nombre del Entrenamiento</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="Ej: Pasadas 10k o Tirada Larga" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="distance_km" class="form-label fw-semibold">Distancia (km)</label>
                            <input type="number" step="0.01" class="form-control" id="distance_km" name="distance_km" placeholder="10.0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="duration_minutes" class="form-label fw-semibold">Duración (minutos)</label>
                            <input type="number" step="0.1" class="form-control" id="duration_minutes" name="duration_minutes" placeholder="46.0" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="shoe_id" class="form-label fw-semibold">Calzado Utilizado</label>
                        <select class="form-select" id="shoe_id" name="shoe_id">
                            <option value="">Ninguno / Otro</option>
                            {% for shoe in shoes %}
                                <option value="{{ shoe.id }}">{{ shoe.brand }} {{ shoe.model_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning fw-bold">Guardar Entrenamiento</button>
                        <a href="/" class="btn btn-outline-secondary btn-sm">Volver al Panel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
